[workspace]
resolver = "2"
members = ["src/crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.38", features = ["bundled"] }
axe-domain = { path = "src/crates/domain" }
axe-session = { path = "src/crates/session" }
axe-agents = { path = "src/crates/agents" }
axe-audio = { path = "src/crates/audio" }
axe-runtime = { path = "src/crates/runtime" }
