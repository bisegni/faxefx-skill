name: Native foundation
on: [push, pull_request]
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python src/tools/ci_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: axe-studio-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*.zip
            dist/*.sha256
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r src/audio-worker/requirements.txt pytest
      - run: python -m pytest -q src/audio-worker
