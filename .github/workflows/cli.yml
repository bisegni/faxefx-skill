name: CLI mock and replay tests
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r config/requirements/cli.txt -r config/requirements/dev.txt
      - run: python -m pytest -c config/pytest.ini --rootdir=. -q
      - run: python tools/axefx.py schema
      - run: python tools/axefx.py --backend mock --state-dir .local/ci-mock preset geometry

  workbench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm test
        working-directory: web

  optional-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r config/requirements/cli.txt -r config/requirements/dev.txt -r config/requirements/audio.txt -r config/requirements/visual.txt
      - run: python -m pytest -c config/pytest.ini --rootdir=. tests/test_audio.py tests/test_design.py tests/test_workbench.py -q
