name: CLI mock and replay tests
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r config/requirements/cli.txt -r config/requirements/dev.txt
      - run: python -m pytest -c config/pytest.ini --rootdir=. -q
      - run: python tools/axefx.py schema
      - run: python tools/axefx.py --backend mock --state-dir .local/ci-mock preset geometry
